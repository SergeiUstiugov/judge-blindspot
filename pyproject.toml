[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "judge-blindspot"
version = "0.1.0"
description = "Measures whether LLM judges share blind spots (miss-correlation per defect class)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["httpx>=0.27"]
local = ["llama-cpp-python>=0.2"]
dev = ["pytest>=7.0"]

[project.scripts]
judge-blindspot = "judge_blindspot.cli:main"

[tool.setuptools]
packages = ["judge_blindspot"]
