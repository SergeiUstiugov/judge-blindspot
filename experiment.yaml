# experiment.yaml — single source of truth for all run parameters.
# No hardcoded params in code; everything is read from here.

# ── Three measurement axes ────────────────────────────────────────────────────
#
# intra-model  : same model, two independent runs with fixed seed
#                → expected phi ≈ +1 (positive control / H1)
#                REQUIRES a local model (cloud APIs do not guarantee seed reproducibility)
#
# inter-family : qwen2.5-coder:7b (Alibaba/Qwen) vs deepseek-coder:6.7b (DeepSeek)
#                → H2: expect 0.2 < phi < 0.7 (shared training corpus → shared blind spots)
#                → axis tests training-lineage difference, not capability-tier difference
#                   (see Amendment 4 in PREREG_AMENDMENT_2026_05_31.md)
#
# ORIGINAL (pre-reg, superseded by Amendment 4, 2026-06-11):
#   inter-capability: claude-haiku-4-5-20251001 × claude-sonnet-4-6 (Anthropic)
#   Reason for substitution: Anthropic API balance exhausted before any H2 run.
#
# cross-type   : LLM judge vs deterministic test runner
#                → H3: expect phi ≈ 0 (structurally orthogonal)
#
# ─────────────────────────────────────────────────────────────────────────────

models:

  # --- intra-model axis: local model with fixed seed ---
  # Replace 'local/llama-3-8b' with the actual model path / id you use.
  # Must support deterministic output with seed (llama-cpp-python or vLLM).
  - id: local/llama-3-8b
    provider: local
    axis: intra_model
    decoding:
      temperature: 0.0
      max_tokens:  256
      seed: 42

  # --- inter-family axis: qwen2.5-coder:7b x deepseek-coder:6.7b (Amendment 4) ---
  # Original pair was claude-haiku-4-5-20251001 x claude-sonnet-4-6 (Anthropic).
  # Substituted 2026-06-11 before any H2 run — see Amendment 4 in PREREG_AMENDMENT_2026_05_31.md.
  - id: qwen2.5-coder:7b
    provider: ollama
    axis: inter_family
    decoding:
      temperature: 0.0
      max_tokens:  256
      seed: 42

  - id: deepseek-coder:6.7b
    provider: ollama
    axis: inter_family
    decoding:
      temperature: 0.0
      max_tokens:  256
      seed: 42

  # --- cross-type axis: LLM vs deterministic test runner ---
  # The test runner is not listed here — it uses the hidden_tests from the corpus
  # and always returns 0 miss (it IS the ground truth by construction).
  # In practice: pair claude-haiku-4-5 against a lightweight static checker
  # (e.g. pylint narrowed to the defect class) to get a meaningful phi ≈ 0.
  - id: claude-haiku-4-5-20251001
    provider: anthropic
    axis: cross_type
    decoding:
      temperature: 0.0
      max_tokens:  256

prompt_templates:
  strict_passfail: prompts/strict_passfail.txt   # main — Phase 2
  rubric:          prompts/rubric.txt             # Phase 7 variant 2
  confidence:      prompts/confidence.txt         # Phase 7 variant 3

# Default prompt for Phase 2 runs
default_prompt: strict_passfail

defect_classes:
  - off_by_one
  - wrong_operator
  - dropped_guard
  - swapped_args

# target n per defect class — original, set by Phase 6 power simulation (2026-05-30)
# ci_hw_target=0.20, worst case phi=0.3 (H2/H3 axes). Applies to H2 and H3 axes.
target_n: 170

# ── Pre-registration amendment 2026-05-31 (BEFORE corpus rebuild) ────────────
#
# H1 (intra-model / close pairs) expected phi:
#   Evidence: pilot_intra3 gave phi=+1.000, CI=[1.000,1.000], n=10 (INCONCLUSIVE n<30).
#   Mechanism: two fixed-seed instances of the same model are near-duplicates, not
#   independent judges → phi expected ≈ 1.0 by construction.
#   Conservative floor for power analysis: phi >= 0.90.
#
# Power simulation results (ci_hw_target=0.15, power>=80%, n_sims=300, n_boot=300, seed=0):
#   phi=0.70: worst-case marginals (0.2,0.2) → min_n=170
#   phi=0.80: worst-case marginals (0.2,0.2) → min_n=130
#   phi=0.90: worst-case marginals (0.2,0.2) → min_n=80
#   phi=0.95: worst-case marginals (0.2,0.2) → min_n=50
#
# Decision (locked 2026-05-31, pre-corpus-rebuild, before viewing per-class counts):
#   H1 axis: target_n_h1 = 80  (phi>=0.90 expected; n<80 flagged UNDERPOWERED, not padded)
#   H2/H3 axes: target_n = 170 (original blanket, phi unknown a priori)
#   Classes with n < target_n_h1 are reported as UNDERPOWERED in Table 2 footnote.
#   No post-hoc adjustment of class n to match observed phi.
target_n_h1: 80

seeds:
  corpus:    0
  bootstrap: 0
  judge_run: 42

output_dir: results/

budget:
  max_api_calls: 10000
  max_cost_usd:  50.0

corpus:
  correct_per_task:   1
  defective_per_task: 2
  contamination_cutoff: "2024-06-01"

# ── Reproducibility note ──────────────────────────────────────────────────────
# Cloud Anthropic API: temperature=0 reduces variance but does NOT guarantee
# identical outputs across calls. For the intra-model axis use the local model.
# Log every call to results/logs/ (model_id, seed, prompt_hash, raw_output, ts).
